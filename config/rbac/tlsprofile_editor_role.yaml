# permissions for end users to edit tlsprofiles.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: clusterrole
    app.kubernetes.io/instance: tlsprofile-editor-role
    app.kubernetes.io/component: rbac
    app.kubernetes.io/created-by: odf-operator
    app.kubernetes.io/part-of: odf-operator
    app.kubernetes.io/managed-by: kustomize
  name: tlsprofile-editor-role
rules:
- apiGroups:
  - odf.openshift.io
  resources:
  - tlsprofiles
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - odf.openshift.io
  resources:
  - tlsprofiles/status
  verbs:
  - get
